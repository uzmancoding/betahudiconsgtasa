; BetaHudIcons ayarlari
[Icon]
; 1 = jetpack/telefonda orijinal weapon ikonunu hook ile gizle ve onun KOORDINATINA birebir ciz (onerilen)
; 0 = hook'u kapat
HideOriginal=1
UseOriginalRect=1

; --- Ince ayar (orijinal ikon rect'ine gore) ---
; Ikon orijinalden kucuk/buyuk duruyorsa yuzde olarak ayarla (100 = orijinalle ayni)
ScaleWidthPercent=100
ScaleHeightPercent=100
; Kaydirma, sanal birim (~1 birim = ~1 piksel). ShiftX + = saga, ShiftY + = asagi
ShiftX=0
ShiftY=0

; --- Yedek konum + orijinal ikonu ARAMA kutusu ---
; Orijinal rect yakalanamazsa ikon buraya cizilir. Ayrica hook'un orijinal ikonu
; aradigi bolgeyi belirler; orijinal ikonun etrafini iyi kapsamali, ama cok da buyutme.
OffsetFromRight=322
OffsetFromTop=44
Width=108
Height=132
